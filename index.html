<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bijli Bill Calculator</title>

<!-- PWA Manifest & App Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">

<!-- Mobile App Settings -->
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bill Calc">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2ef; --card:#ffffff; --ink:#13262b; --muted:#5d7176; --line:#d5dfdb;
  --teal:#0f766e; --amber:#f2a900; --amber-ink:#3d2b00; --a:#0f766e; --b:#c2410c; --warn:#b42318;
  --field:#f6f9f7;
  --whatsapp:#25D366;
  --whatsapp-hover:#1ea952;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1d; --card:#16272b; --ink:#e8f1ee; --muted:#93aaa9; --line:#27403f;
    --teal:#2dd4bf; --a:#2dd4bf; --b:#fb923c; --warn:#ff8a7a; --field:#101e21;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --card:#16272b; --ink:#e8f1ee; --muted:#93aaa9; --line:#27403f;
  --teal:#2dd4bf; --a:#2dd4bf; --b:#fb923c; --warn:#ff8a7a; --field:#101e21;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.dial{width:54px;height:54px;flex:none}
h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
header p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h2{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.group{margin-bottom:20px}
.group:last-child{margin-bottom:0}
.group-title{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
input.name{font-weight:600}
.btns{display:flex;gap:10px;margin-top:6px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.reset{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.submit-btn{background:var(--teal);color:#ffffff;flex:1}
.empty{border:2px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.msg{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:.92rem;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
.stat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.2rem;font-weight:800}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.people{grid-template-columns:1fr}}
.person{border-radius:16px;padding:18px;border:2px solid var(--c)}
.person .who{font-weight:600;color:var(--c);margin:0 0 4px}
.person .amt{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.person dl{margin:12px 0 0;font-size:.88rem}
.person dl div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.person dt{color:var(--muted)}
.person dd{margin:0;font-weight:600}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:18px 0 6px;background:var(--line)}
.bar span{display:block;transition:width .35s ease}
.barlbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.total{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-size:1.4rem;font-weight:800}
.total span{opacity:.8;font-size:.9rem}

/* Share PNG Button */
.btn-share-png{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  margin-top:16px;
  background-color:var(--whatsapp);
  color:#ffffff;
  border:0;
  border-radius:14px;
  padding:14px 20px;
  font-size:1.02rem;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(37,211,102,0.28);
  transition:background-color .2s ease, transform .1s ease;
}
.btn-share-png:hover{
  background-color:var(--whatsapp-hover);
}
.btn-share-png:active{
  transform:scale(0.98);
}
.btn-share-png svg{
  width:22px;
  height:22px;
  fill:currentColor;
  flex:none;
}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="dial" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="25" fill="none" stroke="var(--ink)" stroke-width="3"/>
      <path d="M10 36a18 18 0 0 1 36 0" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
      <path d="M10 36a18 18 0 0 1 22-17.5" fill="none" stroke="var(--amber)" stroke-width="5" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="38" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="3.5" fill="var(--ink)"/>
    </svg>
    <div>
      <h1>Bill Calculator</h1>
      <p>Bill calculation from main meters to sub meters</p>
    </div>
  </header>

  <div class="grid">
    <section class="card" aria-labelledby="in-h">
      <h2 id="in-h">Meter's Information</h2>

      <div class="group">
        <p class="group-title">Main meter</p>
        <div class="row">
          <div><label for="mbill">Total bill (Rs)</label><input id="mbill" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 25000"></div>
          <div><label for="munits">Total units</label><input id="munits" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 800"></div>
        </div>
      </div>

      <div class="group">
        <p class="group-title">Sub meters</p>
        <div class="row">
          <div><label for="n1">First Name</label><input id="n1" class="name" type="text" value="Hashir"></div>
          <div><label for="u1">Units</label><input id="u1" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 350"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label for="n2">Second Name</label><input id="n2" class="name" type="text" value="Muzamil"></div>
          <div><label for="u2">Units</label><input id="u2" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 400"></div>
        </div>
      </div>

      <div class="btns">
        <button class="submit-btn" id="submitBtn" type="button">Calculate Bill</button>
        <button class="reset" id="reset" type="button">Clear</button>
      </div>
    </section>

    <section class="card" aria-labelledby="out-h" aria-live="polite">
      <h2 id="out-h">Calculations</h2>
      <div id="out">
        <div class="empty">Values enter karein aur "Calculate Bill" par click karein.</div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var out = $('out');
  var nf = new Intl.NumberFormat('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
  var uf = new Intl.NumberFormat('en-PK',{maximumFractionDigits:2});
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function val(id){var v=$(id).value; return v===''?NaN:parseFloat(v)}

  var currentData = null;

  function render(){
    var bill=val('mbill'), mu=val('munits'), u1=val('u1'), u2=val('u2');
    var n1=esc($('n1').value.trim()||'Pehla'), n2=esc($('n2').value.trim()||'Doosra');
    var raw_n1 = $('n1').value.trim()||'Pehla';
    var raw_n2 = $('n2').value.trim()||'Doosra';

    if([bill,mu,u1,u2].some(isNaN)){
      out.innerHTML='<div class="msg">Tamam fields (Main Bill, Main Units, aur dono Sub-Meter Units) ko sahi se bharein.</div>';
      currentData = null;
      return;
    }
    if(bill<0||mu<=0||u1<0||u2<0){
      out.innerHTML='<div class="msg">Main meter ke units 0 se zyada hon aur koi value minus mein na ho.</div>';
      currentData = null;
      return;
    }
    var tu=u1+u2;
    if(tu<=0){
      out.innerHTML='<div class="msg">Dono sub meters ke units mila kar 0 se zyada hone chahiye.</div>';
      currentData = null;
      return;
    }
    var per=bill/mu;
    var tbill=tu*per;
    var loss=mu-tu;
    var warn='';
    if(loss<0) warn='<div class="msg">Sub meters ke units main meter se zyada hain, is liye losses minus aa rahe hain. Readings dobara check karein.</div>';
    var l1=(u1/tu)*loss, l2=(u2/tu)*loss;
    var f1=u1+l1, f2=u2+l2;
    var b1=f1*per, b2=f2*per;
    var p1=b1/(b1+b2)*100;
    var p2=100-p1;

    currentData = {
      bill: bill, mu: mu, per: per, tbill: tbill, loss: loss,
      n1: raw_n1, u1: u1, l1: l1, f1: f1, b1: b1, p1: p1,
      n2: raw_n2, u2: u2, l2: l2, f2: f2, b2: b2, p2: p2,
      totalFinal: b1 + b2
    };

    function person(cls,n,u,l,f,b){
      return '<div class="person" style="--c:var(--'+cls+')"><p class="who">'+n+'</p><div class="amt">Rs '+nf.format(b)+'</div>'
        +'<dl><div><dt>Units</dt><dd>'+uf.format(u)+'</dd></div>'
        +'<div><dt>Loss units</dt><dd>'+uf.format(l)+'</dd></div>'
        +'<div><dt>Total units</dt><dd>'+uf.format(f)+'</dd></div></dl></div>';
    }

    var shareBtnHtml = '<button type="button" id="sharePngBtn" class="btn-share-png">'
      + '<svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.45 1.03 2.62.13.17 1.78 2.73 4.32 3.82.6.26 1.07.42 1.44.54.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.12-.22-.19-.47-.32z"/></svg>'
      + 'Share Bill as PNG'
      + '</button>';

    out.innerHTML = warn
      +'<div class="stats">'
      +'<div class="stat"><small>Per unit rate</small><b>Rs '+nf.format(per)+'</b></div>'
      +'<div class="stat"><small>Bill without loss units</small><b>Rs '+nf.format(tbill)+'</b></div>'
      +'<div class="stat"><small>Loss units</small><b>'+uf.format(loss)+'</b></div>'
      +'</div>'
      +'<div class="people">'+person('a',n1,u1,l1,f1,b1)+person('b',n2,u2,l2,f2,b2)+'</div>'
      +'<div class="bar" role="img" aria-label="Bill ki taqseem"><span style="width:'+p1+'%;background:var(--a)"></span><span style="width:'+(100-p1)+'%;background:var(--b)"></span></div>'
      +'<div class="barlbl"><span>'+n1+' '+p1.toFixed(1)+'%</span><span>'+n2+' '+(100-p1).toFixed(1)+'%</span></div>'
      +'<div class="total"><span>Bill with loss units</span><b>Rs '+nf.format(b1+b2)+'</b></div>'
      + shareBtnHtml;

    $('sharePngBtn').addEventListener('click', generateAndSharePNG);
  }

  function generateAndSharePNG(){
    if(!currentData) return;
    var d = currentData;

    var canvas = document.createElement('canvas');
    var w = 820;
    var h = 940;
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');

    function roundRect(x, y, rw, rh, rad, fill, stroke, strokeColor) {
      ctx.beginPath();
      ctx.roundRect(x, y, rw, rh, rad);
      if(fill){ ctx.fillStyle = fill; ctx.fill(); }
      if(stroke){ ctx.strokeStyle = strokeColor; ctx.lineWidth = stroke; ctx.stroke(); }
    }

    roundRect(0, 0, w, h, 28, '#ffffff', 2, '#d5dfdb');

    roundRect(24, 24, w - 48, 90, 16, '#0f766e');
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('BIJLI BILL CALCULATION REPORT', 46, 68);
    ctx.font = '15px sans-serif';
    ctx.fillStyle = '#d0f2ec';
    ctx.fillText('Main Meter se Sub-Meters ki mukammal taqseem', 46, 94);

    var cardY = 134;
    var boxW = (w - 48 - 20) / 3;
    var stats = [
      { t: 'Per Unit Rate', v: 'Rs ' + nf.format(d.per) },
      { t: 'Bill (Without Loss)', v: 'Rs ' + nf.format(d.tbill) },
      { t: 'Loss Units', v: uf.format(d.loss) + ' units' }
    ];
    stats.forEach(function(s, idx){
      var bx = 24 + idx * (boxW + 10);
      roundRect(bx, cardY, boxW, 82, 14, '#f6f9f7', 1.5, '#d5dfdb');
      ctx.fillStyle = '#5d7176';
      ctx.font = '14px sans-serif';
      ctx.fillText(s.t, bx + 16, cardY + 30);
      ctx.fillStyle = '#13262b';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(s.v, bx + 16, cardY + 62);
    });

    var personY = 236;
    var pCardW = (w - 48 - 16) / 2;
    var pData = [
      { name: d.n1, u: d.u1, l: d.l1, f: d.f1, b: d.b1, p: d.p1, b_noloss: d.u1 * d.per, col: '#0f766e', bg: '#f2fcf9' },
      { name: d.n2, u: d.u2, l: d.l2, f: d.f2, b: d.b2, p: d.p2, b_noloss: d.u2 * d.per, col: '#c2410c', bg: '#fffaf6' }
    ];

    pData.forEach(function(p, idx){
      var px = 24 + idx * (pCardW + 16);
      roundRect(px, personY, pCardW, 350, 18, p.bg, 2, p.col);

      ctx.fillStyle = p.col;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(p.name, px + 20, personY + 36);

      ctx.fillStyle = '#13262b';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('Rs ' + nf.format(p.b), px + 20, personY + 74);

      ctx.font = 'bold 15px sans-serif';
      ctx.fillStyle = p.col;
      ctx.fillText('Share: ' + p.p.toFixed(1) + '%', px + 20, personY + 100);

      var rows = [
        { label: 'Chalay huay Units:', val: uf.format(p.u) },
        { label: 'Loss Units:', val: uf.format(p.l) },
        { label: 'Total Units (inc. Loss):', val: uf.format(p.f) },
        { label: 'Bill Without Loss:', val: 'Rs ' + nf.format(p.b_noloss) },
        { label: 'Final Bill (With Loss):', val: 'Rs ' + nf.format(p.b) }
      ];

      var ly = personY + 130;
      rows.forEach(function(r, ri){
        ctx.strokeStyle = '#e2ebe7';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + 20, ly - 16);
        ctx.lineTo(px + pCardW - 20, ly - 16);
        ctx.stroke();

        ctx.fillStyle = ri === 4 ? '#13262b' : '#5d7176';
        ctx.font = (ri === 4 ? 'bold ' : '') + '15px sans-serif';
        ctx.fillText(r.label, px + 20, ly);

        ctx.fillStyle = ri === 4 ? p.col : '#13262b';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(r.val, px + pCardW - 20, ly);
        ctx.textAlign = 'left';

        ly += 42;
      });
    });

    var barY = 610;
    ctx.fillStyle = '#5d7176';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('Distribution & Percentage Ratio:', 28, barY + 16);

    ctx.textAlign = 'right';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#0f766e';
    ctx.fillText(d.n1 + ' (' + d.p1.toFixed(1) + '%)', w / 2 - 10, barY + 16);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c2410c';
    ctx.fillText(d.n2 + ' (' + d.p2.toFixed(1) + '%)', w / 2 + 10, barY + 16);

    roundRect(24, barY + 28, w - 48, 22, 11, '#e5eae7');
    var w1 = ((w - 48) * (d.p1 / 100));
    roundRect(24, barY + 28, w1, 22, 11, '#0f766e');
    roundRect(24 + w1, barY + 28, (w - 48) - w1, 22, 11, '#c2410c');

    var totalY = 684;
    roundRect(24, totalY, w - 48, 96, 18, '#13262b');
    ctx.fillStyle = '#a6b8be';
    ctx.font = '16px sans-serif';
    ctx.fillText('Grand Total (Bill with Loss Units)', 46, totalY + 42);
    ctx.font = '14px sans-serif';
    ctx.fillText('Main Meter Units: ' + uf.format(d.mu) + ' | Main Bill: Rs ' + nf.format(d.bill), 46, totalY + 70);

    ctx.fillStyle = '#2dd4bf';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Rs ' + nf.format(d.totalFinal), w - 46, totalY + 60);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#83969b';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Generated via Bijli Bill Calculator • ' + new Date().toLocaleDateString('en-GB'), w / 2, 820);
    ctx.textAlign = 'left';

    canvas.toBlob(function(blob){
      if(!blob) return;
      var file = new File([blob], 'Bijli_Bill_Calculation.png', { type: 'image/png' });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({
          files: [file]
        }).catch(function(err){
          console.log('Share dismissed or failed:', err);
        });
      } else {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Bijli_Bill_Calculation.png';
        a.click();
        alert('Bill PNG image download ho chuki hai. Aap isay WhatsApp par share kar sakte hain.');
      }
    }, 'image/png');
  }

  // Calculate sirf button click par chalega
  $('submitBtn').addEventListener('click', render);

  $('reset').addEventListener('click',function(){
    ['mbill','munits','u1','u2'].forEach(function(i){$(i).value=''});
    $('n1').value='Hashir';$('n2').value='Muzamil';
    out.innerHTML='<div class="empty">Values enter karein aur "Calculate Bill" par click karein.</div>';
    currentData = null;
  });
})();
</script>

<!-- PWA Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker Registered'))
      .catch((err) => console.log('Service Worker Failed:', err));
  });
}
</script>
</body>
</html>
